# Tracked BEAST packages for the beast3 migration.
#
# Fields:
#   name:        Display name in CHECKLIST.md
#   path:        Local checkout path (relative to this repo, or absolute)
#   github:      "<org>/<repo>" used to link the package row
#   maven:       "<groupId>:<artifactId>" — used to query Maven Central; omit if not published
#   stage:       Author hint: maven_central | compile_tested | in_progress | not_started
#   notes:       Optional free-text shown in the table
#   specFocus:   true if the migration target is the `.spec.` Java sub-packages
#                only — Java checks (tally, input rule, Input<@Deprecated>,
#                punch lists) restrict to classes in `.spec.` packages and
#                ignore the legacy classes still in place. Leave unset (default
#                false) for packages still being assessed end-to-end.
#   xmlExcludeDirs: optional list of directory names (case-insensitive). XMLs
#                with any matching path component are excluded from the XML /
#                fxtemplate scan. Use for development/validation directories
#                whose XMLs aren't part of the assembled package. The scan also
#                independently skips XMLs not tracked by git when the package
#                is a git working tree, so stray run output doesn't need an
#                explicit exclude.

packages:
  - name: beast3
    path: ../beast3
    github: CompEvol/beast3
    maven: io.github.compevol:beast3
    stage: maven_central
    specFocus: true
    notes: Core. Multi-module — beast-base / beast-fx / beast-pkgmgmt / beast-test-utils.

  - name: BEASTLabs
    path: ../BEASTLabs
    github: BEAST2-Dev/BEASTlabs
    maven: io.github.beast2-dev:beast-labs
    stage: maven_central

  - name: beast-classic
    path: ../beast-classic
    github: BEAST2-Dev/beast-classic
    maven: io.github.beast2-dev:beast-classic
    stage: maven_central

  - name: CoupledMCMC
    path: ../CoupledMCMC
    github: CompEvol/CoupledMCMC
    maven: io.github.compevol:coupled-mcmc
    stage: maven_central

  - name: flc
    path: ../flc
    github: 4ment/flc
    maven: io.github.4ment:flc
    stage: maven_central

  - name: Mascot
    path: ../Mascot
    github: CompEvol/Mascot
    maven: io.github.compevol:mascot
    stage: maven_central

  - name: morph-models
    path: ../morph-models
    github: CompEvol/morph-models
    maven: io.github.compevol:morph-models
    stage: maven_central

  - name: sampled-ancestors
    path: ../sampled-ancestors
    github: CompEvol/sampled-ancestors
    maven: io.github.compevol:sampled-ancestors
    stage: maven_central

  - name: MutableAlignment
    path: ../MutableAlignment
    github: alexeid/MutableAlignment
    maven: io.github.compevol:mutable-alignment
    stage: compile_tested
    notes: Migration WIP on alexeid fork's `beast3` branch (Maven, JPMS module). Upstream rbouckaert/MutableAlignment is still on the Ant-based BEAST 2.7 layout.

  - name: ORC
    path: ../ORC
    github: jordandouglas/ORC
    maven: io.github.jordandouglas:beast-orc
    stage: maven_central

  - name: bModelTest
    path: ../bModelTest
    github: BEAST2-Dev/bModelTest
    maven: io.github.beast2-dev:bModelTest
    stage: compile_tested

  - name: obama
    path: ../obama-beast3
    github: rbouckaert/obama
    maven: io.github.rbouckaert:obama
    stage: compile_tested

  - name: feast
    path: ../feast
    github: tgvaughan/feast
    maven: io.github.tgvaughan:feast
    stage: compile_tested
    notes: Tasty additions to BEAST 2. v11.0.0 is the first beast3-targeted release.

  - name: GammaSpikeModel
    path: ../GammaSpikeModel
    github: jordandouglas/GammaSpikeModel
    maven: io.github.jordandouglas:beast-gammaspike
    stage: compile_tested

  - name: BDMM-Prime
    path: ../BDMM-Prime
    github: tgvaughan/BDMM-Prime
    maven: io.github.tgvaughan:bdmm-prime
    stage: compile_tested
    notes: Migration WIP on `beast2.8-migration` branch (Maven, v3.0.0).
    xmlExcludeDirs: [validation]   # development XMLs, not part of the assembled package (issue #2)

  - name: remaster
    path: ../remaster
    github: tgvaughan/remaster
    maven: io.github.tgvaughan:remaster
    stage: compile_tested
    notes: Migration WIP on `beast2.8-migration` branch (Maven, v3.0.0).
  
  - name: contacTrees
    path: ../contacTrees
    github: NicoNeureiter/contacTrees
    maven: io.github.niconeureiter:contactrees
    stage: maven_central
